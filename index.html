<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>LASUED CBT</title>

  <!-- 🔗 WhatsApp / Facebook / Instagram / TikTok / Telegram -->
  <meta property="og:title" content="LASUED CBT">
  <meta property="og:description" content="Welcome Esteemed Scholars — Select a course and access your learning materials.">
  <meta property="og:image" content="https://student-cbt.vercel.app/student.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:url" content="https://student-cbt.vercel.app/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="LASUED CBT">

  <!-- 🐦 Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="LASUED CBT">
  <meta name="twitter:description" content="Welcome Esteemed Scholars — Select a course and access your learning materials.">
  <meta name="twitter:image" content="https://student-cbt.vercel.app/student.jpg">

  <!-- 📱 PWA Meta Tags -->
  <meta name="theme-color" content="#5A2D82">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LASUEDCbt">
  <link rel="apple-touch-icon" href="student.jpg">
  <link rel="manifest" href="/manifest.json">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      background: #F8F7FC;
    }
    h1, h2, h3, .font-heading {
      font-family: 'Poppins', sans-serif;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    }
    .course-card {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 16px;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .course-card:active {
      transform: scale(0.97);
      background: rgba(90, 45, 130, 0.15);
    }
    .splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #5A2D82 0%, #9B7BCE 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .splash-screen.fade-out {
      opacity: 0;
      transform: translateY(-20px);
      pointer-events: none;
    }
    .app-content {
      display: none;
    }
    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeInUp 0.8s ease-out forwards;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .install-pulse {
      animation: pulse 2s infinite;
    }
  </style>
</head>
<body class="min-h-screen">

  <!-- ⏳ SPLASH SCREEN (2 seconds) -->
  <div id="splash" class="splash-screen">
    <div class="glass-card w-[80%] max-w-[320px] py-12 px-6 flex flex-col items-center justify-center text-center animate-fade-in">
      <svg class="w-16 h-16 text-white/40 mb-4" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 3L1 9l4 2.18v4.64L12 21l7-5.18v-4.64L23 9l-11-6zm0 2.18l7.68 4.18L12 13.54l-7.68-4.18L12 5.18zM5 12.47l7 3.79 7-3.79v4.22l-7 5.18-7-5.18v-4.22z"/>
      </svg>
      <h1 class="text-white text-4xl md:text-5xl font-heading font-bold tracking-tight leading-tight">Welcome<br>Esteemed Scholars</h1>
    </div>
  </div>

  <!-- 📚 MAIN COURSE SELECTION SCREEN -->
  <div id="app" class="app-content flex flex-col min-h-screen bg-gradient-to-b from-[#F8F7FC] to-white">
    
    <!-- Header with LASUED Logo -->
    <div class="flex flex-col items-center pt-10 pb-6 px-4">
      <img src="lasued.png" alt="LASUED logo" class="h-20 w-auto object-contain mb-4">
      <h2 class="text-3xl font-heading font-bold text-[#5A2D82]">Select a Course</h2>
      <p class="text-sm text-[#9B7BCE] mt-1">Tap to open course materials</p>
    </div>

    <!-- Course Cards Container -->
    <div class="flex-1 px-4 pb-6 space-y-3 max-w-md mx-auto w-full">
      <div id="courseList" class="space-y-3">
        <!-- Cards generated by JavaScript -->
      </div>
    </div>

    <!-- Footer -->
    <div class="text-center py-6 text-xs text-[#9B7BCE] flex items-center justify-center gap-1">
      <span>Credited by LASUED COMMUNITY</span>
      <svg class="w-4 h-4 text-red-400 fill-current" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd" />
      </svg>
    </div>
  </div>

  <!-- 📲 INSTALL APP BUTTON -->
  <button id="installBtn" class="fixed bottom-5 right-5 bg-[#5A2D82] text-white px-5 py-3 rounded-full shadow-xl font-semibold text-sm install-pulse z-50 hidden items-center gap-2" style="display: none;">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
    </svg>
    Install App
  </button>

  <script>
    // 📲 PWA Install
    let deferredPrompt;

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      console.log("📲 Install prompt ready");
      const installBtn = document.getElementById("installBtn");
      if (installBtn) {
        installBtn.style.display = "flex";
      }
    });

    window.addEventListener("appinstalled", () => {
      console.log("✅ App installed!");
      const installBtn = document.getElementById("installBtn");
      if (installBtn) {
        installBtn.style.display = "none";
      }
      deferredPrompt = null;
    });

    // 📋 Course Data - 3 Courses
    const courses = [
      { code: "COS121", title: "Problem Solving" },
      { code: "LASUED-CSC124", title: "Learning Theories for ICT Teachers and Pedagogical Applications in the Classroom" },
      { code: "LASUED-CSC125", title: "Application of Information Systems in Education" }
    ];

    // 🏗 Generate Course Cards
    const container = document.getElementById('courseList');
    
    courses.forEach(course => {
      const card = document.createElement('div');
      card.className = "course-card px-4 py-4 flex items-center gap-3 shadow-sm";
      card.setAttribute('data-href', `${course.code}.html`);
      
      card.innerHTML = `
        <div class="w-10 h-10 rounded-full bg-purple-100 flex items-center justify-center text-[#5A2D82] flex-shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
          </svg>
        </div>
        
        <div class="flex-1 min-w-0">
          <p class="font-semibold text-[#5A2D82] text-sm">${course.code}</p>
          <p class="text-xs text-gray-600 truncate">${course.title}</p>
        </div>
        
        <svg class="w-5 h-5 text-[#9B7BCE] flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
        </svg>
      `;
      
      card.addEventListener('click', () => {
        const href = card.getAttribute('data-href');
        if (href) window.location.href = href;
      });
      
      container.appendChild(card);
    });

    // 📲 Install Button Click
    document.getElementById("installBtn").addEventListener("click", async () => {
      if (!deferredPrompt) {
        alert("Install not available right now. Try opening in Chrome or Edge.");
        return;
      }
      deferredPrompt.prompt();
      const choice = await deferredPrompt.userChoice;
      console.log(`User choice: ${choice.outcome}`);
      deferredPrompt = null;
      document.getElementById("installBtn").style.display = "none";
    });

    // ⏱ Splash + Service Worker
    const splash = document.getElementById('splash');
    const app = document.getElementById('app');

    window.addEventListener('load', () => {
      setTimeout(() => {
        splash.querySelector('.glass-card').style.transform = 'scale(1.03)';
        splash.querySelector('.glass-card').style.transition = 'transform 1.0s ease-out';
      }, 100);

      setTimeout(() => {
        splash.classList.add('fade-out');
        app.style.display = 'flex';
        app.style.flexDirection = 'column';
        setTimeout(() => {
          splash.style.display = 'none';
        }, 800);
      }, 2000);

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/service-worker.js")
          .then(reg => console.log("✅ Service Worker Registered:", reg.scope))
          .catch(err => console.log("❌ Service Worker Error:", err));
      }
    });
  </script>
</body>
</html>
